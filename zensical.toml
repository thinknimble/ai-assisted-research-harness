[project]
site_name = "Research Assistant"
site_description = "User guide for the AI-powered research assistant — search your document library and manage research references from the command line."
site_author = "thinknimble"
copyright = "Copyright &copy; 2026 thinknimble"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    "getting-started/index.md",
    "getting-started/installation.md",
    "getting-started/first-run.md",
  ]},
  { "Usage" = [
    "usage/index.md",
    "usage/reception-mode.md",
    "usage/backoffice-mode.md",
    "usage/managing-repos.md",
    "usage/research-ignore.md",
  ]},
  { "FAQ" = "faq.md" },
]

[project.theme]
features = [
  "content.code.copy",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.toc]
permalink = true
